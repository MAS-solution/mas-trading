name: Estudio
on:
  schedule:
    - cron: "30 6 * * *"   # todos los dias 06:30 UTC
  workflow_dispatch:
jobs:
  estudio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt histdata==1.1
      # los anios cerrados se bajan una sola vez y quedan en cache
      - uses: actions/cache@v4
        with:
          path: datos/crudo
          key: histdata-${{ github.run_id }}
          restore-keys: histdata-
      - run: python scanner/historia.py 5
      - run: python scanner/estudio.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
